<div class="flex h-screen bg-gray-100">
    <app-sidenav [isOpen]="isOpen" [isMobile]="isMobile" (toggleSidebar)="toggleSidebar()"></app-sidenav>

    <!-- Main content -->
    <div class="flex-1 transition-all duration-300"
        [ngClass]="{'lg:ml-64': isOpen && !isMobile, 'lg:ml-0': !isOpen || isMobile}">
        <app-header (toggleSidebar)="toggleSidebar()"></app-header>

        <!-- Content -->
        <main class="p-6">
            <router-outlet></router-outlet>
        </main>
    </div>
</div>
