<h1 class="login-title">Login</h1>

<form #Loginform="ngForm" (ngSubmit)="onSubmit(Loginform)" class="login-form">
    <div class="login-field">
        <label for="email">Email</label>
        <input id="email" name="email" #email="ngModel" required email ngModel type="email"
            placeholder="you@example.com" />
    </div>

    <div class="login-field">
        <label for="password">Password</label>
        <input id="password" name="password" #password="ngModel" required minlength="6" ngModel type="password"
            placeholder="Enter your password" />
    </div>

    @if(email.touched && email.dirty && email.invalid){
    <p style="color: red;">Invalid email address.</p>
    }
    @if(password.touched && password.dirty && password.invalid){
    <p style="color: red;">Invalid password.</p>
    }

    <button type="submit" class="login-button">Login</button>
</form>
